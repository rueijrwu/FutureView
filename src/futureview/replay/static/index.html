<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FutureView MES Replay</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><h1>FutureView MES Replay</h1><div class="subtle">5-minute historical bar replay · actual contracts</div></div>
      <div class="status-grid"><span id="contract-status">—</span><span id="cursor-status">No session</span><span id="state-status" class="badge">STOPPED</span></div>
    </header>
    <section class="setup-panel">
      <label>Contract<select id="contract"></select></label>
      <label>Start time<input id="start-time" type="datetime-local" step="300" /></label>
      <label>Warmup bars<input id="warmup" type="number" min="0" max="5000" value="300" /></label>
      <button id="start" class="primary">Start Replay</button>
      <span id="range" class="subtle"></span>
    </section>
    <section id="chart" class="chart"></section>
    <section class="control-panel">
      <div class="transport"><button id="restart">↺ Restart</button><button id="next">▶| Next Bar</button><button id="play" class="primary">▶ Play</button><button id="pause">⏸ Pause</button></div>
      <div class="speeds" id="speeds"><span>Speed</span><button data-speed="1" class="active">1x</button><button data-speed="5">5x</button><button data-speed="10">10x</button><button data-speed="25">25x</button><button data-speed="50">50x</button><button data-speed="100">100x</button><button data-speed="max">Max</button></div>
      <div id="error" class="error"></div>
    </section>
    <footer class="chart-credit">TradingView Lightweight Charts™ · Copyright © 2025 TradingView, Inc. · <a href="https://www.tradingview.com/" target="_blank" rel="noreferrer">TradingView</a></footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
