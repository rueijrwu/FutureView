[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mes-replay"
version = "0.1.0"
description = "Standalone MES historical bar replay and backtest simulator"
requires-python = ">=3.12"
dependencies = [
  "databento>=0.64",
  "pandas>=2.2",
  "pyarrow>=18",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
mes-replay = "mes_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
