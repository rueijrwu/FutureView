<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FutureView</title>
  <script>
    if (!localStorage.getItem("futureview_auth_token")) location.replace("/login.html");
  </script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/chart-overlays.css">
  <script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://unpkg.com/lightweight-charts-drawing@0.1.1/dist/lightweight-charts-drawing.umd.js"></script>
</head>
<body>
  <main>
    <section class="setup">
      <label>Product<select id="product"><option value="MES">MES</option><option value="ES">ES</option></select></label>
      <label>Start (ET)<input id="start" type="datetime-local" step="60"></label>
      <input id="warmup" type="hidden" value="1500">
      <button id="start-btn" class="primary">Start Replay</button>
      <button id="random-btn" type="button">🎲 Random</button>
      <span id="range">The actual contract is selected automatically from prior-session volume.</span>
      <div class="session-status" aria-label="Replay session status">
        <b id="contract-status">Auto contract</b>
        <span id="time-status">No session</span>
        <span id="state-status" class="pill">STOPPED</span>
        <button id="logout" type="button">Log out</button>
      </div>
    </section>

    <section id="workspace" class="workspace">
      <div id="chart-toolbar" class="chart-toolbar" role="toolbar" aria-label="Chart tools">
        <div class="tool-group">
          <span>Indicators</span>
          <span class="indicator-pick"><button data-tool="sma5" aria-pressed="false">SMA5</button><button type="button" class="fv-color-swatch" data-indicator-color="sma5" title="SMA5 color"></button></span>
          <span class="indicator-pick"><button data-tool="sma10" aria-pressed="false">SMA10</button><button type="button" class="fv-color-swatch" data-indicator-color="sma10" title="SMA10 color"></button></span>
          <span class="indicator-pick"><button data-tool="sma20" aria-pressed="false">SMA20</button><button type="button" class="fv-color-swatch" data-indicator-color="sma20" title="SMA20 color"></button></span>
          <span class="indicator-pick"><button data-tool="sma60" aria-pressed="false">SMA60</button><button type="button" class="fv-color-swatch" data-indicator-color="sma60" title="SMA60 color"></button></span>
          <span class="indicator-pick"><button data-tool="vwap" aria-pressed="false">VWAP</button><button type="button" class="fv-color-swatch" data-indicator-color="vwap" title="VWAP color"></button></span>
        </div>
        <div class="tool-group"><span>Draw</span><button data-tool="trend" aria-pressed="false">Trend</button><button data-tool="ray" aria-pressed="false">Ray</button><button data-tool="hline" aria-pressed="false">H-Line</button><button data-tool="vline" aria-pressed="false">V-Line</button><button data-tool="rect" aria-pressed="false">Rect</button><button data-tool="fib" aria-pressed="false">Fib</button><button data-tool="text" aria-pressed="false">Text</button><button type="button" class="fv-color-swatch" id="draw-color" title="Annotation color"></button><button data-tool="undo">Undo</button><button data-tool="clear">Clear</button></div>
        <div class="tool-group"><span>View</span><button data-tool="crosshair" aria-pressed="false">Magnet</button><button data-tool="zoom-in">Zoom +</button><button data-tool="zoom-out">Zoom −</button><button data-tool="fit">Fit</button><button data-tool="latest">Latest</button><button data-tool="log" aria-pressed="false">Linear</button></div>
      </div>
      <div id="chart-legend" class="chart-legend">O — H — L — C — V —</div>
      <div class="plot-area">
        <div id="chart"></div>
        <div class="chart-overlay chart-timeframe-overlay" role="toolbar" aria-label="Chart timeframe">
          <button data-timeframe="1" aria-pressed="false">1m</button>
          <button data-timeframe="5" class="active" aria-pressed="true">5m</button>
          <button data-timeframe="30" aria-pressed="false">30m</button>
          <button data-timeframe="240" aria-pressed="false">4h</button>
          <button data-timeframe="1D" aria-pressed="false">1D</button>
        </div>
        <div id="chart-range-toolbar" class="chart-overlay chart-range-overlay" role="toolbar" aria-label="Visible history range">
          <button data-history-range="1D" aria-pressed="false">1D</button>
          <button data-history-range="5D" class="active" aria-pressed="true">5D</button>
          <button data-history-range="1M" aria-pressed="false">1M</button>
          <button data-history-range="3M" aria-pressed="false">3M</button>
        </div>
      </div>
      <aside id="trade-sidebar" class="trade-sidebar" aria-label="Trading record">
        <div class="trade-summary">
          <div><span>Position</span><strong id="trade-position">Flat</strong></div>
          <div><span>Avg</span><strong id="trade-avg">—</strong></div>
          <div><span>Unrealized</span><strong id="trade-unrealized">$0.00</strong></div>
          <div><span>Realized</span><strong id="trade-realized">$0.00</strong></div>
          <div><span>Total P&amp;L</span><strong id="trade-total">$0.00</strong></div>
        </div>
        <div class="trade-table-wrap">
          <table class="trade-table">
            <thead><tr><th>#</th><th>Side</th><th>Qty</th><th>Fill</th><th>P&amp;L</th></tr></thead>
            <tbody id="trade-rows"><tr class="trade-empty"><td colspan="5">No trades yet</td></tr></tbody>
          </table>
        </div>
        <div class="trade-ledger-toolbar">
          <button id="trade-clear" type="button">Clear</button>
          <button id="console-toggle" type="button" aria-pressed="false">Console</button>
        </div>
      </aside>
    </section>

    <section class="controls">
      <div class="replay-controls">
        <div class="transport"><button id="restart">↺ Restart</button><button id="next">▶| Next</button><button id="play" class="primary">▶ Play</button><button id="pause">⏸ Pause</button></div>
        <div id="speeds" class="speeds"><span>Speed</span><button data-speed="1" class="active">1</button><button data-speed="5">5</button><button data-speed="10">10</button><button data-speed="50">50</button><button data-speed="100">100</button><button data-speed="max">Max</button></div>
      </div>
      <div class="trade-entry">
        <span>Trade</span><span>Qty</span><input id="trade-qty" type="number" min="1" max="100" value="1" inputmode="numeric">
        <button id="buy-btn" class="buy" type="button">Buy</button>
        <button id="sell-btn" class="sell" type="button">Sell</button>
        <button id="trades-toggle" type="button" aria-pressed="false">Trades</button>
      </div>
    </section>

    <section id="trading-console" class="trading-console-details" hidden>
      <div id="trade-detail" class="trade-detail">Click a fill to inspect it.</div>
    </section>

    <div id="error"></div>
  </main>
  <script src="/chart-tools.js"></script>
  <script src="/chart-tools-fixes.js"></script>
  <script src="/chart-ui-repair.js"></script>
  <script src="/api-fetch.js"></script>
  <script src="/replay-range.js"></script>
  <script src="/app.js"></script>
</body>
</html>
