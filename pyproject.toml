[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futureview-replay"
version = "0.2.0"
description = "FutureView historical market replay and backtest platform"
requires-python = ">=3.12"
dependencies = [
  "databento>=0.64",
  "pandas>=2.2",
  "pyarrow>=18",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
futureview-replay = "futureview_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
futureview_replay = ["static/*.html", "static/*.css", "static/*.js"]
