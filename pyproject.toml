[project]
name = "futureview"
version = "0.1.0"
description = "Market screening, ranking, portfolio research, and backtesting platform"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "polars>=1.0",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
