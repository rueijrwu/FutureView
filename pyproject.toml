[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futureview-replay"
version = "0.3.0"
description = "FutureView historical market replay and backtest platform"
requires-python = ">=3.12"
dependencies = [
  "databento>=0.64",
  "pandas>=2.2",
  "pyarrow>=18",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28", "ruff>=0.6"]

[project.scripts]
futureview-replay = "futureview_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
futureview_replay = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Scoped to pyflakes only: unreferenced imports, redefinitions and unused
# locals/variables (F401/F811/F841 among them) - exactly what CURRENT_PLAN.md
# sections 2.3/2.4 found by hand. E/W (style, line length) are deliberately not
# enabled here: the existing tree has ~30 pre-existing style findings unrelated
# to this pass, and turning those into a CI gate is a separate decision with a
# separate diff, not something to fold into a dead-code/perf pass.
select = ["F"]
