[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futureview"
version = "0.1.0"
description = "FutureView CNN trend research"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "pandas>=2.2",
  "yfinance>=0.2.54",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
futureview-smoke = "futureview.smoke:main"
futureview-data-smoke = "futureview.data_smoke:main"
