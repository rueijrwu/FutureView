[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futureview"
version = "0.1.0"
description = "FutureView CNN trend research"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "yfinance>=0.2.54",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
futureview-smoke = "futureview.smoke:main"
futureview-data-smoke = "futureview.data_smoke:main"
futureview-pipeline-smoke = "futureview.pipeline_smoke:main"
futureview-training-smoke = "futureview.training_smoke:main"
futureview-strategy1-smoke = "futureview.strategy1_smoke:main"
futureview-strategy1-target-smoke = "futureview.strategy1_target_smoke:main"
futureview-strategy1-feasibility = "futureview.strategy1_feasibility:main"
futureview-strategy1-training-compare = "futureview.strategy1_training_compare:main"
futureview-strategy1-seed-stability = "futureview.strategy1_seed_stability:main"
futureview-strategy1-exposure-smoke = "futureview.strategy1_exposure_smoke:main"
futureview-strategy1-target-compare = "futureview.strategy1_target_compare:main"
futureview-strategy1-summary-baseline = "futureview.strategy1_summary_baseline:main"
futureview-strategy1-summary-fusion = "futureview.strategy1_summary_fusion:main"
futureview-strategy1-entry-value-compare = "futureview.strategy1_entry_value_compare_5y:main"
futureview-strategy1-entry-regret-compare = "futureview.strategy1_entry_regret_compare_5y:main"
futureview-strategy1-entry-horizon-baseline = "futureview.strategy1_entry_horizon_baseline:main"
futureview-strategy1-baseline-oracle-30d = "futureview.strategy1_baseline_oracle_30d:main"
futureview-strategy1-reference-distribution = "futureview.strategy1_reference_distribution:main"
futureview-strategy1-oos-portfolio = "futureview.strategy1_oos_portfolio:main"
futureview-strategy1-oos-portfolio-rank-gate = "futureview.strategy1_oos_portfolio_rank_gate:main"
futureview-strategy1-oos-portfolio-recent-rank = "futureview.strategy1_oos_portfolio_recent_rank_gate:main"
futureview-strategy1-model-compare = "futureview.strategy1_model_compare:main"
futureview-strategy1-frequency-compare = "futureview.strategy1_frequency_compare_alpaca:main"
futureview-strategy1-frequency-compare-alpaca = "futureview.strategy1_frequency_compare_alpaca:main"
futureview-strategy1-frequency-compare-massive = "futureview.strategy1_frequency_compare:main"
futureview-strategy1-frequency-compare-limited = "futureview.strategy1_frequency_compare_limited:main"
futureview-alpaca-data-smoke = "futureview.alpaca_data_smoke:main"
futureview-massive-data-smoke = "futureview.massive_data_smoke:main"
