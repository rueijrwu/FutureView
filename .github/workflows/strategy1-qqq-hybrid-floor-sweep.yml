name: Strategy 1 QQQ Hybrid Floor Sweep

on:
  push:
    branches:
      - cnn-trend-reset
    paths:
      - "src/futureview/strategy1_success_hybrid_floor_sweep.py"
      - "src/futureview/strategy1_success_adaptive_gate.py"
      - "src/futureview/strategy1_success_entry_window.py"
      - "src/futureview/strategy1_success_threshold.py"
      - "src/futureview/strategy1_success_training.py"
      - "pyproject.toml"
      - ".github/workflows/strategy1-qqq-hybrid-floor-sweep.yml"
  workflow_dispatch:

jobs:
  qqq-hybrid-floor-sweep:
    runs-on: ubuntu-24.04
    env:
      FUTUREVIEW_TICKER: QQQ
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout cnn-trend-reset
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps

      - name: Sweep hybrid floor Q50 Q55 Q60 Q65
        run: |
          set -o pipefail
          futureview-strategy1-success-hybrid-floor-sweep 2>&1 | tee strategy1-qqq-hybrid-floor-sweep.log

      - name: Write results to job summary
        if: always()
        run: |
          {
            echo '## Strategy 1 QQQ Hybrid Floor Sweep'
            echo
            echo 'Branch: `cnn-trend-reset`'
            echo 'Ticker: `QQQ`'
            echo 'Adaptive gate: `rolling Q70 of last 30 observed scores`'
            echo 'Floors: `calibration Q50 / Q55 / Q60 / Q65`'
            echo 'Entry execution: `first legal session in t+1..t+3`'
            echo
            if [[ -f strategy1-qqq-hybrid-floor-sweep.log ]]; then
              echo '```text'
              grep -E '^S1 HYBRID_FLOOR_SWEEP (DATA|RULE|FOLD_METRIC|SUMMARY|PASS)' strategy1-qqq-hybrid-floor-sweep.log || true
              echo '```'
            else
              echo 'No hybrid-floor-sweep log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hybrid floor sweep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-qqq-hybrid-floor-sweep-${{ github.run_number }}
          path: strategy1-qqq-hybrid-floor-sweep.log
          if-no-files-found: warn
          retention-days: 30
