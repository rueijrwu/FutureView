name: Strategy 1 Layer2 15D150 Full Train
on:
  workflow_dispatch:
  push:
    branches: [layer2-price-distribution-v1]
    paths:
      - 'src/futureview/strategy1_layer2_15d150_full_train.py'
      - '.github/workflows/strategy1-layer2-15d150-full-train.yml'
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FUTUREVIEW_TICKER: TSLA
      FUTUREVIEW_DATA_PERIOD: 8y
      FUTUREVIEW_W: '30'
      FUTUREVIEW_MODEL_HISTORY: '90'
      FUTUREVIEW_PRICE_HORIZON: '3'
      FUTUREVIEW_EPOCHS: '300'
      FUTUREVIEW_ROLL_DAYS: '15'
      FUTUREVIEW_TRAIN_MEMORY: '150'
      FUTUREVIEW_PURGE_DAYS: '3'
      FUTUREVIEW_OUTPUT: strategy1-layer2-15d150-full-oos.csv
      FUTUREVIEW_MODEL_OUT: strategy1-layer2-15d150-final.pt
      FUTUREVIEW_META_OUT: strategy1-layer2-15d150-final.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'yfinance>=0.2.54' 'numba>=0.61' 'scikit-learn>=1.5' 'torch>=2.4'
          python -m pip install -e . --no-deps
      - name: Full train
        run: |
          set -o pipefail
          python -m futureview.strategy1_layer2_15d150_full_train 2>&1 | tee strategy1-layer2-15d150-full-train.log
      - name: Summary
        if: always()
        run: |
          { echo '## Strategy 1 — 15D/150 full train'; echo; echo '```text'; grep -E '^S1 FULL' strategy1-layer2-15d150-full-train.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy1-layer2-15d150-full-train
          path: |
            strategy1-layer2-15d150-full-oos.csv
            strategy1-layer2-15d150-final.pt
            strategy1-layer2-15d150-final.json
            strategy1-layer2-15d150-full-train.log
