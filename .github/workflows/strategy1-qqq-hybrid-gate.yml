name: Strategy 1 QQQ Hybrid Gate

on:
  push:
    branches:
      - cnn-trend-reset
    paths:
      - "src/futureview/strategy1_success_hybrid_gate.py"
      - "pyproject.toml"
      - ".github/workflows/strategy1-qqq-hybrid-gate.yml"
  workflow_dispatch:

jobs:
  qqq-hybrid-gate:
    runs-on: ubuntu-24.04
    env:
      FUTUREVIEW_TICKER: QQQ
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout cnn-trend-reset
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps

      - name: Compare fixed Q70 adaptive Q70 and hybrid gate
        run: |
          set -o pipefail
          futureview-strategy1-success-hybrid-gate 2>&1 | tee strategy1-qqq-hybrid-gate.log

      - name: Write results to job summary
        if: always()
        run: |
          {
            echo '## Strategy 1 QQQ Hybrid Gate'
            echo
            echo 'Branch: `cnn-trend-reset`'
            echo 'Ticker: `QQQ`'
            echo 'Fixed baseline: `calibration Q70`'
            echo 'Adaptive baseline: `rolling Q70 of last 30 observed scores`'
            echo 'Hybrid: `max(rolling Q70, calibration Q50 floor)`'
            echo 'Entry execution: `first legal session in t+1..t+3`'
            echo
            if [[ -f strategy1-qqq-hybrid-gate.log ]]; then
              echo '```text'
              grep -E '^S1 HYBRID_GATE (DATA|RULE|FOLD_METRIC|SUMMARY|PASS)' strategy1-qqq-hybrid-gate.log || true
              echo '```'
            else
              echo 'No hybrid-gate log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hybrid gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-qqq-hybrid-gate-${{ github.run_number }}
          path: strategy1-qqq-hybrid-gate.log
          if-no-files-found: warn
          retention-days: 30
