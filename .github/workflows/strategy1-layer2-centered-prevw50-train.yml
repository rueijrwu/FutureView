name: Strategy 1 Layer2 Centered Previous-W Prefilter Train

on:
  push:
    branches: [tmp-entry-centered-cq]
    paths:
      - 'src/futureview/strategy1_layer2_centered_prevw50_train.py'
      - '.github/workflows/strategy1-layer2-centered-prevw50-train.yml'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Run training audit
        env:
          FUTUREVIEW_TICKER: TSLA
          FUTUREVIEW_DATA_PERIOD: 10y
          FUTUREVIEW_W: '30'
          FUTUREVIEW_EPOCHS: '120'
          FUTUREVIEW_SEED: '20260827'
        run: |
          set -o pipefail
          python -m futureview.strategy1_layer2_centered_prevw50_train 2>&1 | tee strategy1-layer2-centered-prevw50-train.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 Layer2 — centered C/Q with previous-W Neutral prefilter'
            echo
            echo '```text'
            grep -E '^S1 L2PW50' strategy1-layer2-centered-prevw50-train.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
