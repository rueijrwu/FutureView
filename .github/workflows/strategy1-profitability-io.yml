name: Strategy 1 Profitability IO

on:
  push:
    branches: [strategy-profitability-autoencoder]
    paths:
      - 'src/futureview/strategy1_profitability_io.py'
      - '.github/workflows/strategy1-profitability-io.yml'
      - 'src/futureview/strategy1.py'
      - 'src/futureview/strategy1_reference_distribution.py'
      - 'src/futureview/strategy1_reference_distribution_fast.py'
      - 'src/futureview/strategy1_cq_data.py'
  workflow_dispatch:

jobs:
  io:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps
      - name: Build standardized Layer-1 IO
        env:
          FUTUREVIEW_WORKERS: '1'
          FUTUREVIEW_REGIME_WINDOW: '60'
          FUTUREVIEW_REGIME_STRIDE: '1'
        run: |
          set -o pipefail
          python -m futureview.strategy1_profitability_io 2>&1 | tee strategy1-profitability-io.log
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-profitability-io-${{ github.run_number }}
          path: |
            strategy1-profitability-io.log
            strategy1-profitability-io.npz
            strategy1-profitability-io.json
          retention-days: 30
