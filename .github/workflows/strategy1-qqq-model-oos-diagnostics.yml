name: Strategy 1 QQQ Q Calibration Diagnostics

on:
  push:
    branches:
      - cnn-trend-reset
    paths:
      - 'src/futureview/strategy1_success_model_oos_diagnostics.py'
      - 'src/futureview/strategy1_success_training.py'
      - 'src/futureview/strategy1_success_live_campaign_expanded_oos.py'
      - 'src/futureview/strategy1.py'
      - 'src/futureview/strategy1_reference_distribution.py'
      - 'src/futureview/strategy1_reference_distribution_fast.py'
      - 'src/futureview/features.py'
      - 'src/futureview/models.py'
      - 'src/futureview/data.py'
      - 'pyproject.toml'
      - '.github/workflows/strategy1-qqq-model-oos-diagnostics.yml'
  workflow_dispatch:

jobs:
  qqq-q-calibration-diagnostics:
    runs-on: ubuntu-24.04
    env:
      FUTUREVIEW_TICKER: QQQ
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - name: Checkout cnn-trend-reset
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps

      - name: Diagnose QQQ Entry Path Profitability Rate calibration
        run: |
          set -o pipefail
          futureview-strategy1-success-model-oos-diagnostics 2>&1 | tee strategy1-qqq-q-calibration.log

      - name: Write results to job summary
        if: always()
        run: |
          {
            echo '## Strategy 1 QQQ Q Calibration Diagnostics'
            echo
            echo 'Branch: `cnn-trend-reset`'
            echo 'Ticker: `QQQ`'
            echo 'Primary target: `Q(e) = Entry Path Profitability Rate`'
            echo 'Purpose: `OOS probability estimation / calibration`'
            echo 'Selection threshold: `none`'
            echo 'Trade gate: `none`'
            echo 'Probability bins: `fixed 0.20 width`'
            echo
            if [[ -f strategy1-qqq-q-calibration.log ]]; then
              echo '```text'
              grep -E '^S1 Q_DIAGNOSTICS (DATA|RULE|FOLD|BIN|POOLED_BIN|SUMMARY|PASS)' strategy1-qqq-q-calibration.log || true
              echo '```'
            else
              echo 'No Q calibration diagnostics log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Q calibration diagnostics log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-qqq-q-calibration-${{ github.run_number }}
          path: strategy1-qqq-q-calibration.log
          if-no-files-found: warn
          retention-days: 30
