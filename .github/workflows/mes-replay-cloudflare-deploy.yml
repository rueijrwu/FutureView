name: MES Replay Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mes-replay-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve or create dedicated D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          RESPONSE=$(curl -fsS "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          DB_ID=$(printf '%s' "$RESPONSE" | jq -r '.result[]? | select(.name == "futureview-mes-replay") | .uuid' | head -n 1)
          if [ -z "$DB_ID" ]; then
            RESPONSE=$(curl -fsS -X POST "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data '{"name":"futureview-mes-replay"}')
            DB_ID=$(printf '%s' "$RESPONSE" | jq -r '.result.uuid // empty')
          fi
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Generate deploy config
        working-directory: mes-replay/cloudflare
        run: |
          node --input-type=commonjs <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('wrangler.jsonc','utf8');
          const config=JSON.parse(text);
          config.d1_databases=[{binding:'DB',database_name:'futureview-mes-replay',database_id:process.env.D1_DATABASE_ID,migrations_dir:'migrations'}];
          fs.writeFileSync('.wrangler.deploy.json',JSON.stringify(config,null,2));
          NODE
      - name: Apply D1 migrations
        working-directory: mes-replay/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 d1 migrations apply futureview-mes-replay --remote --config .wrangler.deploy.json
      - name: Deploy standalone replay Worker
        working-directory: mes-replay/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 deploy --config .wrangler.deploy.json
