name: Deploy FutureView Worker

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          secrets: |
            MASSIVE_API_KEY
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}

      - name: One-time ingest 2026-08-21
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          HOST="$(printf '%s' "$DEPLOYMENT_URL" | sed 's/ .*//')"
          if [ -z "$HOST" ]; then
            echo "Deployment URL output is empty"
            exit 1
          fi
          if [[ "$HOST" == http://* || "$HOST" == https://* ]]; then
            BASE_URL="$HOST"
          else
            BASE_URL="https://$HOST"
          fi
          echo "Triggering one-time Cloudflare ingest for 2026-08-21"
          curl --fail-with-body --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            -X POST "${BASE_URL%/}/api/ingest/manual-once?date=2026-08-21"
          echo

      - name: Verify Cloudflare ingest metadata in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object get \
            futureview-data/metadata/latest-cloudflare-ingest.json \
            --remote --pipe
          echo
