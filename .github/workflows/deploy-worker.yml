name: Deploy FutureView Worker

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "worker/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: futureview-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve or create FutureView D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          RESPONSE=$(curl -fsS "$API" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          DB_ID=$(printf '%s' "$RESPONSE" | jq -r \
            '.result[]? | select(.name == "futureview") | .uuid' | head -n 1)

          if [ -z "$DB_ID" ]; then
            RESPONSE=$(curl -fsS -X POST "$API" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"futureview"}')
            DB_ID=$(printf '%s' "$RESPONSE" | jq -r '.result.uuid // empty')
          fi

          if [ -z "$DB_ID" ]; then
            echo "Unable to resolve or create FutureView D1 database"
            exit 1
          fi

          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Generate deploy config with D1 binding
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases = [{
            binding: 'DB',
            database_name: 'futureview',
            database_id: process.env.D1_DATABASE_ID,
            migrations_dir: 'migrations',
          }];
          fs.writeFileSync('.wrangler.generated.json', JSON.stringify(config, null, 2));
          NODE

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.125.0 d1 migrations apply futureview
          --remote --config .wrangler.generated.json

      - name: Deploy Worker and Workflows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 deploy --config .wrangler.generated.json
