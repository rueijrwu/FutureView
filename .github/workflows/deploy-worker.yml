name: Deploy FutureView Worker

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker and Workflow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 deploy
