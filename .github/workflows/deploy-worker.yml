name: Deploy FutureView Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          secrets: |
            MASSIVE_API_KEY
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
