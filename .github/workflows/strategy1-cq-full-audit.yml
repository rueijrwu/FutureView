name: Strategy 1 C Q Full Audit

on:
  push:
    branches:
      - strategy-profitability-restart
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61" "scikit-learn>=1.5"
          python -m pip install -e . --no-deps
      - name: Run full C Q audit
        env:
          FUTUREVIEW_TICKER: TSLA
          FUTUREVIEW_DATA_PERIOD: 5y
          FUTUREVIEW_LAYER1_WINDOW: '30'
          FUTUREVIEW_A_RANDOM_SAMPLES: '20'
          FUTUREVIEW_A_RANDOM_SEED: '20260827'
        run: |
          python -m futureview.strategy1_cq_full_audit 2>&1 | tee strategy1-cq-full-audit.log
      - name: Summary
        run: |
          {
            echo '## Strategy 1 — Ungated C/Q full audit'
            echo
            echo '```text'
            grep -E '^S1 CQ FULL' strategy1-cq-full-audit.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
