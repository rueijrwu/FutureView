name: Strategy1 Entry Exit C Q Distribution

on:
  push:
    branches:
      - strategy-profitability-autoencoder
    paths:
      - 'src/futureview/strategy1_entry_exit_cq_distribution.py'
      - '.github/workflows/strategy1-entry-exit-cq-distribution.yml'
  workflow_dispatch:

jobs:
  cq-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install --upgrade pip numpy pandas yfinance
      - name: Run pure statistical C/Q diagnostic
        env:
          PYTHONPATH: src
          FUTUREVIEW_TICKERS: SPY,QQQ
          FUTUREVIEW_PERIOD: 5y
          FUTUREVIEW_CQ_WINDOW: '60'
          FUTUREVIEW_CQ_MIN_OUTCOMES: '5'
        run: python -m futureview.strategy1_entry_exit_cq_distribution
