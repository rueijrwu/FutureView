name: Strategy 1 Leakage Audit

on:
  push:
    branches: [layer2-price-distribution-v1]
    paths:
      - 'src/futureview/strategy1_leakage_audit.py'
      - '.github/workflows/strategy1-leakage-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        w: [20, 30, 45, 60]
    env:
      FUTUREVIEW_TICKER: TSLA
      FUTUREVIEW_DATA_PERIOD: 8y
      FUTUREVIEW_W: ${{ matrix.w }}
      FUTUREVIEW_MODEL_HISTORY: 90
      FUTUREVIEW_ROLL_DAYS: 10
      FUTUREVIEW_L2_MEMORY: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'yfinance>=0.2.54' 'numba>=0.61' 'scikit-learn>=1.5' 'torch>=2.4'
          python -m pip install -e . --no-deps
      - name: Run leakage audit
        run: |
          set -o pipefail
          python -m futureview.strategy1_leakage_audit 2>&1 | tee strategy1-leakage-audit-W${{ matrix.w }}.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — leakage audit W=${{ matrix.w }}'
            echo
            echo '```text'
            grep '^S1 LEAK' strategy1-leakage-audit-W${{ matrix.w }}.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy1-leakage-audit-W${{ matrix.w }}
          path: strategy1-leakage-audit-W${{ matrix.w }}.log
          if-no-files-found: warn
