name: Strategy 1 Layer2 Probability Calibration Audit

on:
  push:
    branches: [layer2-price-distribution-v1]
    paths:
      - 'src/futureview/strategy1_layer2_probability_calibration_audit.py'
      - '.github/workflows/strategy1-layer2-probability-calibration-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'yfinance>=0.2.54' 'numba>=0.61' 'scikit-learn>=1.5' 'torch>=2.4'
          python -m pip install -e . --no-deps
      - name: Run audit
        env:
          FUTUREVIEW_TICKER: TSLA
          FUTUREVIEW_DATA_PERIOD: 8y
          FUTUREVIEW_W: '30'
          FUTUREVIEW_MODEL_HISTORY: '90'
          FUTUREVIEW_PRICE_HORIZON: '3'
          FUTUREVIEW_EPOCHS: '300'
          FUTUREVIEW_MIN_TRAIN: '100'
          FUTUREVIEW_MIN_VALID: '20'
          FUTUREVIEW_CAL_ROLL_N: '100'
          FUTUREVIEW_CAL_ROLL_MIN: '60'
          FUTUREVIEW_OUTPUT: strategy1-layer2-probability-calibration-audit.csv
        run: |
          set -o pipefail
          python -m futureview.strategy1_layer2_probability_calibration_audit 2>&1 | tee strategy1-layer2-probability-calibration-audit.log
      - name: Summary
        run: |
          {
            echo '## Strategy 1 — Layer2 probability calibration audit'
            echo
            echo '```text'
            grep -E '^S1 CAL' strategy1-layer2-probability-calibration-audit.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: strategy1-layer2-probability-calibration-audit
          path: |
            strategy1-layer2-probability-calibration-audit.csv
            strategy1-layer2-probability-calibration-audit-rolling.csv
            strategy1-layer2-probability-calibration-audit.log
