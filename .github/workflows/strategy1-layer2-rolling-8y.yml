name: Strategy 1 Layer 2 Rolling 8Y

on:
  workflow_dispatch:
  push:
    branches: [strategy-profitability-restart]
    paths:
      - 'src/futureview/strategy1_layer2_rolling_8y.py'
      - 'src/futureview/strategy1_deterministic_paths_asof.py'
      - 'tests/test_strategy1_deterministic_paths_asof.py'
      - '.github/workflows/strategy1-layer2-rolling-8y.yml'

jobs:
  rolling:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'yfinance>=0.2.54' 'numba>=0.61' 'scikit-learn>=1.5' pytest torch
          python -m pip install -e . --no-deps
      - name: Unit tests
        run: pytest -q tests/test_strategy1_deterministic_paths_asof.py tests/test_strategy1_layer2_forward_smoke.py
      - name: Run rolling validation
        env:
          FUTUREVIEW_TICKER: TSLA
          FUTUREVIEW_DATA_PERIOD: 8y
          FUTUREVIEW_W: '30'
          FUTUREVIEW_MODEL_HISTORY: '90'
          FUTUREVIEW_TRAIN_YEARS: '5'
          FUTUREVIEW_VALID_YEARS: '3'
          FUTUREVIEW_NEUTRAL_ALPHA: '0.2'
          FUTUREVIEW_EPOCHS: '300'
          FUTUREVIEW_SEED: '20260827'
          FUTUREVIEW_ROLLING_OUTPUT: strategy1-layer2-rolling-8y.csv
        run: |
          set -o pipefail
          python -m futureview.strategy1_layer2_rolling_8y 2>&1 | tee strategy1-layer2-rolling-8y.log
      - name: Upload rolling comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-layer2-rolling-8y
          path: strategy1-layer2-rolling-8y.csv
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — Layer2 rolling 8Y / 5Y train / final 3Y validation'
            echo
            echo '```text'
            grep -E '^S1 L2ROLL' strategy1-layer2-rolling-8y.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
