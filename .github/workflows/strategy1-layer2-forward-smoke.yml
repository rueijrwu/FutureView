name: Strategy 1 Layer 2 Forward Prediction Smoke

on:
  workflow_dispatch:
  push:
    branches: [strategy-profitability-restart]
    paths:
      - 'src/futureview/strategy1_layer2_forward_smoke.py'
      - 'src/futureview/strategy1_layer2_forward_dataset.py'
      - 'tests/test_strategy1_layer2_forward_smoke.py'
      - '.github/workflows/strategy1-layer2-forward-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'yfinance>=0.2.54' 'numba>=0.61' 'scikit-learn>=1.5' pytest torch
          python -m pip install -e . --no-deps
      - name: Unit tests
        run: pytest -q tests/test_strategy1_layer2_forward_smoke.py
      - name: Run smoke model
        env:
          FUTUREVIEW_TICKER: TSLA
          FUTUREVIEW_DATA_PERIOD: 5y
          FUTUREVIEW_W: '30'
          FUTUREVIEW_MODEL_HISTORY: '90'
          FUTUREVIEW_NEUTRAL_ALPHA: '0.2'
          FUTUREVIEW_EPOCHS: '300'
          FUTUREVIEW_SEED: '20260827'
          FUTUREVIEW_COMPARISON_OUTPUT: strategy1-layer2-forward-comparison.csv
        run: |
          set -o pipefail
          python -m futureview.strategy1_layer2_forward_smoke 2>&1 | tee strategy1-layer2-forward-smoke.log
      - name: Upload comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-layer2-forward-comparison
          path: strategy1-layer2-forward-comparison.csv
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — Layer2 forward prediction smoke'
            echo
            echo '```text'
            grep -E '^S1 L2SMOKE' strategy1-layer2-forward-smoke.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
