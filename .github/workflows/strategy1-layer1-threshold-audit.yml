name: Strategy 1 Layer 1 Rolling Threshold Audit

on:
  push:
    branches: [strategy-profitability-restart]
    paths:
      - 'src/futureview/strategy1_layer1_threshold_audit.py'
      - '.github/workflows/strategy1-layer1-threshold-audit.yml'
  workflow_dispatch:

jobs:
  threshold-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps
      - name: Run rolling threshold audit
        env:
          FUTUREVIEW_TICKER: 'TSLA'
          FUTUREVIEW_DATA_PERIOD: '5y'
          FUTUREVIEW_LAYER1_WINDOW: '30'
          FUTUREVIEW_LAYER1_REFERENCE_WINDOWS: '60'
          FUTUREVIEW_LAYER1_LOW_Q: '0.40'
          FUTUREVIEW_LAYER1_HIGH_Q: '0.60'
          FUTUREVIEW_A_RANDOM_SAMPLES: '20'
          FUTUREVIEW_A_RANDOM_SEED: '20260827'
          FUTUREVIEW_LAYER1_THRESHOLD_OUTPUT: 'strategy1-layer1-threshold-audit.csv'
        run: |
          set -o pipefail
          python -m futureview.strategy1_layer1_threshold_audit 2>&1 | tee strategy1-layer1-threshold-audit.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — Layer 1 rolling threshold audit'
            echo
            echo '```text'
            grep -E '^S1 LAYER1 (ROLLING_START|ROLLING_DEFINITION|ROLLING R=|ROLLING_CHRONO|ROLLING_THRESHOLD|ROLLING_OUTPUT|ROLLING_COMPLETE)' strategy1-layer1-threshold-audit.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy1-layer1-threshold-audit-${{ github.run_number }}
          path: |
            strategy1-layer1-threshold-audit.log
            strategy1-layer1-threshold-audit.csv
          retention-days: 30
