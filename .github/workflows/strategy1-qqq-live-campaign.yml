name: Strategy 1 QQQ Live Campaign

on:
  push:
    branches:
      - cnn-trend-reset
    paths:
      - "src/futureview/strategy1_success_live_campaign.py"
      - "pyproject.toml"
      - ".github/workflows/strategy1-qqq-live-campaign.yml"
  workflow_dispatch:

jobs:
  qqq-live-campaign:
    runs-on: ubuntu-24.04
    env:
      FUTUREVIEW_TICKER: QQQ
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout cnn-trend-reset
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps

      - name: Backtest locked Q55 single live campaigns
        run: |
          set -o pipefail
          futureview-strategy1-success-live-campaign 2>&1 | tee strategy1-qqq-live-campaign.log

      - name: Write results to job summary
        if: always()
        run: |
          {
            echo '## Strategy 1 QQQ Live Campaign'
            echo
            echo 'Branch: `cnn-trend-reset`'
            echo 'Ticker: `QQQ`'
            echo 'Gate: `max(rolling Q70, calibration Q55)`'
            echo 'Entry: `first legal session in t+1..t+3`'
            echo 'Capital state: `flat -> pending -> campaign -> flat`'
            echo 'Overlap: `disabled`'
            echo
            if [[ -f strategy1-qqq-live-campaign.log ]]; then
              echo '```text'
              grep -E '^S1 LIVE_CAMPAIGN (DATA|RULE|FOLD_METRIC|CAMPAIGN|SUMMARY|PASS)' strategy1-qqq-live-campaign.log || true
              echo '```'
            else
              echo 'No live-campaign log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live campaign log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-qqq-live-campaign-${{ github.run_number }}
          path: strategy1-qqq-live-campaign.log
          if-no-files-found: warn
          retention-days: 30
