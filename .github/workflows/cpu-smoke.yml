name: CPU Smoke

on:
  push:
    branches:
      - cnn-trend-reset
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"

      - name: Install runtime dependencies
        run: python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54"

      - name: Install project without dependency resolution
        run: python -m pip install -e . --no-deps

      - name: Run CPU model smoke test
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: futureview-smoke

      - name: Run SPY data smoke test
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: futureview-data-smoke

      - name: Run feature-label-window pipeline smoke test
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: futureview-pipeline-smoke

      - name: Run real-data CPU training smoke test
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: futureview-training-smoke

      - name: Run Strategy 1 Oracle smoke test
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: futureview-strategy1-smoke

      - name: Run Strategy 1 formal target smoke test
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: futureview-strategy1-target-smoke
