name: CPU Smoke

on:
  push:
    branches:
      - cnn-trend-reset
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run CPU model smoke test
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: futureview-smoke

      - name: Run SPY data smoke test
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: futureview-data-smoke

      - name: Run feature-label-window pipeline smoke test
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: futureview-pipeline-smoke

      - name: Run real-data CPU training smoke test
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: futureview-training-smoke
