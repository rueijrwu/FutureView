name: Strategy 1 Entry Return Distribution Diagnostic

on:
  push:
    branches: [cnn-trend-reset]
    paths:
      - 'src/futureview/strategy1_entry_return_distribution_diagnostic.py'
      - '.github/workflows/strategy1-entry-return-distribution-diagnostic.yml'
  workflow_dispatch:

jobs:
  entry-return-distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps
      - name: Run entry return distribution diagnostic
        env:
          CUDA_VISIBLE_DEVICES: ''
          FUTUREVIEW_WORKERS: '1'
        run: |
          set -o pipefail
          python -m futureview.strategy1_entry_return_distribution_diagnostic 2>&1 | tee strategy1-entry-return-distribution-diagnostic.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — Entry Return Distribution Diagnostic'
            echo
            echo '```text'
            grep -E '^S1 ENTRY_DIST (DATA|FOLD|SUMMARY|COMPLETE)' strategy1-entry-return-distribution-diagnostic.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy1-entry-return-distribution-${{ github.run_number }}
          path: strategy1-entry-return-distribution-diagnostic.log
          retention-days: 30
