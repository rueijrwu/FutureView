name: Strategy 1 Layer 1 Alpha Sensitivity Audit

on:
  push:
    branches: [strategy-profitability-restart]
    paths:
      - 'src/futureview/strategy1_layer1_alpha_sensitivity_audit.py'
      - 'tests/test_strategy1_layer1_alpha_sensitivity_audit.py'
      - '.github/workflows/strategy1-layer1-alpha-sensitivity-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61" "scikit-learn>=1.5" pytest
          python -m pip install -e . --no-deps
      - name: Unit tests
        run: pytest -q tests/test_strategy1_layer1_alpha_sensitivity_audit.py
      - name: Run audit
        env:
          FUTUREVIEW_TICKER: TSLA
          FUTUREVIEW_DATA_PERIOD: 5y
          FUTUREVIEW_W: '30'
          FUTUREVIEW_SHORT_REF: '90'
          FUTUREVIEW_LONG_REF: '756'
          FUTUREVIEW_NEUTRAL_ALPHAS: '0,0.1,0.2,0.5,1.0'
          FUTUREVIEW_SEED: '20260827'
          FUTUREVIEW_OUTPUT: strategy1-layer1-alpha-sensitivity-audit.csv
        run: |
          set -o pipefail
          python -m futureview.strategy1_layer1_alpha_sensitivity_audit 2>&1 | tee strategy1-layer1-alpha-sensitivity-audit.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — Layer 1 neutral alpha sensitivity audit'
            echo
            echo '```text'
            grep -E '^S1 L1ALPHA' strategy1-layer1-alpha-sensitivity-audit.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
