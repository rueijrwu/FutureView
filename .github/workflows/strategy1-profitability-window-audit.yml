name: Strategy 1 Profitability Window Audit

on:
  push:
    branches: [strategy-profitability-autoencoder]
    paths:
      - 'src/futureview/strategy1_profitability_window_audit.py'
      - '.github/workflows/strategy1-profitability-window-audit.yml'
      - 'src/futureview/strategy1_profitability_io.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps
      - name: Audit fixed calendar windows
        env:
          FUTUREVIEW_WORKERS: '1'
          FUTUREVIEW_REGIME_WINDOWS: '20,30,40,60,90,120'
        run: |
          set -o pipefail
          python -m futureview.strategy1_profitability_window_audit 2>&1 | tee strategy1-profitability-window-audit.log
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-profitability-window-audit-${{ github.run_number }}
          path: strategy1-profitability-window-audit.log
          retention-days: 30
