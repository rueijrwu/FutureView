name: Strategy 1 C/Q Mu Gate Sweep

on:
  push:
    branches: [cnn-trend-reset]
    paths:
      - 'src/futureview/strategy1_cq_mu_gate_sweep.py'
      - '.github/workflows/strategy1-cq-mu-gate-sweep.yml'
  workflow_dispatch:

jobs:
  cq-mu-gate-sweep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps
      - name: Run mu gate sweep
        env:
          CUDA_VISIBLE_DEVICES: ''
          FUTUREVIEW_WORKERS: '1'
        run: |
          set -o pipefail
          python -m futureview.strategy1_cq_mu_gate_sweep 2>&1 | tee strategy1-cq-mu-gate-sweep.log
      - name: Summary
        run: |
          {
            echo '## Strategy 1 — C/Q Mu Gate Sweep'
            echo
            echo '```text'
            grep -E '^S1 CQ_MU_SWEEP (DATA|RESULT|SUMMARY|COMPLETE)' strategy1-cq-mu-gate-sweep.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: strategy1-cq-mu-gate-sweep-${{ github.run_number }}
          path: strategy1-cq-mu-gate-sweep.log
          retention-days: 30
