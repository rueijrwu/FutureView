name: Replay Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'cloudflare/**'
      - 'pyproject.toml'
      - 'data/databento/mes/raw/**'
      - '.github/workflows/replay-cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: futureview-replay-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Pull MES historical archive
        run: |
          git lfs install
          git lfs pull --include='data/databento/mes/raw/*.dbn.zst'
          test $(find data/databento/mes/raw -name '*.dbn.zst' | wc -l) -gt 80

      - name: Build cloud replay data
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          futureview-replay prepare --product MES --raw data/databento/mes/raw --runtime runtime/MES
          futureview-replay cloud-export --runtime runtime/MES --output runtime/MES/cloud-export
          test -f runtime/MES/cloud-export/manifest.json

      - name: Publish replay data to R2
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: bash publish-r2.sh ../runtime/MES/cloud-export

      - name: Resolve or create replay D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          RESPONSE=$(curl -fsS "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          DB_ID=$(printf '%s' "$RESPONSE" | jq -r '.result[]? | select(.name == "futureview-replay") | .uuid' | head -n 1)
          if [ -z "$DB_ID" ]; then
            RESPONSE=$(curl -fsS -X POST "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data '{"name":"futureview-replay"}')
            DB_ID=$(printf '%s' "$RESPONSE" | jq -r '.result.uuid // empty')
          fi
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Generate production config
        working-directory: cloudflare
        run: |
          node --input-type=commonjs <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.name='futureview';
          config.d1_databases=[{binding:'DB',database_name:'futureview-replay',database_id:process.env.D1_DATABASE_ID,migrations_dir:'migrations'}];
          fs.writeFileSync('.wrangler.deploy.json',JSON.stringify(config,null,2));
          NODE

      - name: Apply D1 migrations
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 d1 migrations apply futureview-replay --remote --config .wrangler.deploy.json

      - name: Deploy FutureView replay Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 deploy --config .wrangler.deploy.json
