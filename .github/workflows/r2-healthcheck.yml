name: R2 Healthcheck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FutureView
        run: python -m pip install .

      - name: Verify R2 bucket access
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python - <<'PY'
          from futureview.storage.r2 import R2Store

          store = R2Store.from_env()
          store.healthcheck()
          store.put_bytes(
              "metadata/github-actions-healthcheck.txt",
              b"FutureView GitHub Actions can write to Cloudflare R2.\n",
              content_type="text/plain",
          )
          print("R2 connection and write test succeeded.")
          PY
