name: Archive Raw Data to R2

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/archive-raw-r2.yml'

permissions:
  contents: read

concurrency:
  group: futureview-raw-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Pull raw Databento LFS archive
        run: |
          set -euo pipefail
          git lfs install
          git lfs pull --include='data/databento/mes/raw/*.dbn.zst'
          COUNT=$(find data/databento/mes/raw -type f -name '*.dbn.zst' | wc -l)
          echo "raw_files=$COUNT"
          test "$COUNT" -gt 80
          while IFS= read -r file; do test "$(stat -c%s "$file")" -gt 1000; done < <(find data/databento/mes/raw -type f -name '*.dbn.zst' | sort)

      - name: Build immutable raw manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('data/databento/mes/raw')
          files = []
          for path in sorted(root.glob('*.dbn.zst')):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              files.append({
                  'filename': path.name,
                  'bytes': path.stat().st_size,
                  'sha256': h.hexdigest(),
                  'r2_key': f'raw/databento/GLBX.MDP3/MES/ohlcv-1m/{path.name}',
              })
          manifest = {
              'version': 1,
              'provider': 'Databento',
              'dataset': 'GLBX.MDP3',
              'product': 'MES',
              'schema': 'ohlcv-1m',
              'format': 'dbn.zst',
              'files': files,
          }
          Path('raw-manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(f'RAW_MANIFEST files={len(files)} bytes={sum(x["bytes"] for x in files)}')
          PY

      - name: Upload raw archive and manifest to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREFIX='raw/databento/GLBX.MDP3/MES/ohlcv-1m'
          while IFS= read -r file; do
            name=$(basename "$file")
            echo "R2 PUT $PREFIX/$name"
            npx --yes wrangler@4.125.0 r2 object put "futureview-data/$PREFIX/$name" --file "$file" --remote
          done < <(find data/databento/mes/raw -type f -name '*.dbn.zst' | sort)
          npx --yes wrangler@4.125.0 r2 object put "futureview-data/$PREFIX/manifest.json" --file raw-manifest.json --remote

      - name: Verify R2 raw manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREFIX='raw/databento/GLBX.MDP3/MES/ohlcv-1m'
          npx --yes wrangler@4.125.0 r2 object get "futureview-data/$PREFIX/manifest.json" --file r2-manifest.json --remote
          cmp raw-manifest.json r2-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('r2-manifest.json').read_text())
          assert len(m['files']) > 80
          print(f'RAW_R2_OK files={len(m["files"])}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: raw-databento-manifest
          path: raw-manifest.json
          retention-days: 30
