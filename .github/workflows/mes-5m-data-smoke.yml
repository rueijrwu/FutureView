name: MES 5m Data Smoke

on:
  push:
    branches: [intraday-futures-reset]
    paths:
      - 'HANDOFF.md'
      - 'src/futureview/market_data/**'
      - 'tests/test_yahoo_market_data.py'
      - 'pyproject.toml'
      - '.github/workflows/mes-5m-data-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mes-data-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'yfinance>=0.2.54' pytest
          python -m pip install -e . --no-deps
      - name: Run market-data unit tests
        run: python -m pytest -q tests/test_yahoo_market_data.py
      - name: Download recent MES 5-minute bars
        run: |
          set -o pipefail
          START=$(date -u -d '7 days ago' +%F)
          END=$(date -u -d 'tomorrow' +%F)
          mkdir -p artifacts
          futureview-download-bars \
            --symbol 'MES=F' \
            --interval 5m \
            --start "$START" \
            --end "$END" \
            --output artifacts/mes_5m.csv.gz 2>&1 | tee mes-5m-data-smoke.log
      - name: Validate downloaded MES bars
        run: |
          python - <<'PY' | tee -a mes-5m-data-smoke.log
          import pandas as pd

          path = 'artifacts/mes_5m.csv.gz'
          df = pd.read_csv(path, parse_dates=['timestamp'])
          required = ['timestamp', 'symbol', 'open', 'high', 'low', 'close', 'volume']
          missing = [c for c in required if c not in df.columns]
          if missing:
              raise SystemExit(f'missing columns: {missing}')
          if df.empty:
              raise SystemExit('MES download returned zero rows')
          if not (df['symbol'] == 'MES=F').all():
              raise SystemExit('unexpected symbol values')
          if df['timestamp'].duplicated().any():
              raise SystemExit('duplicate timestamps found')
          if not df['timestamp'].is_monotonic_increasing:
              raise SystemExit('timestamps are not monotonic')
          if df[['open', 'high', 'low', 'close', 'volume']].isna().any().any():
              raise SystemExit('OHLCV contains null values')
          if (df['volume'] < 0).any():
              raise SystemExit('negative volume found')
          if (df['high'] < df[['open', 'close', 'low']].max(axis=1)).any():
              raise SystemExit('invalid high values')
          if (df['low'] > df[['open', 'close', 'high']].min(axis=1)).any():
              raise SystemExit('invalid low values')
          print('MES_5M_OK', f'rows={len(df)}', f'first={df["timestamp"].iloc[0]}', f'last={df["timestamp"].iloc[-1]}', f'volume_sum={df["volume"].sum():.0f}')
          PY
      - name: Summary
        if: always()
        run: |
          {
            echo '## MES 5m Data Smoke'
            echo
            echo '```text'
            grep -E 'MES_5M_OK|stored symbol=|YAHOO ' mes-5m-data-smoke.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mes-5m-data-smoke-${{ github.run_number }}
          path: |
            mes-5m-data-smoke.log
            artifacts/mes_5m.csv.gz
          retention-days: 30
