name: Strategy 1 Layer 1 Forward W Audit

on:
  push:
    branches: [strategy-profitability-restart]
    paths:
      - 'src/futureview/strategy1_layer1_forward_w_audit.py'
      - 'src/futureview/strategy1_deterministic_paths.py'
      - '.github/workflows/strategy1-layer1-forward-w-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61" "scikit-learn>=1.5"
          python -m pip install -e . --no-deps
      - name: Run audit
        shell: bash
        env:
          FUTUREVIEW_TICKER: TSLA
          FUTUREVIEW_DATA_PERIOD: 5y
          FUTUREVIEW_W: '30'
          FUTUREVIEW_SHORT_REF: '90'
          FUTUREVIEW_LONG_REF: '756'
          FUTUREVIEW_SEED: '20260827'
        run: |
          set -o pipefail
          python -m futureview.strategy1_layer1_forward_w_audit 2>&1 | tee strategy1-layer1-forward-w-audit.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Strategy 1 — Layer 1 past-W vs next-W audit'
            echo
            echo '```text'
            grep -E '^S1 L1FW' strategy1-layer1-forward-w-audit.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
