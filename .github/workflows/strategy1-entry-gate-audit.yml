name: Strategy 1 Entry Gate Audit

on:
  push:
    branches: [strategy-profitability-restart]
    paths:
      - 'src/futureview/strategy1_entry_gate_audit.py'
      - '.github/workflows/strategy1-entry-gate-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61" "scikit-learn>=1.5"
          python -m pip install -e . --no-deps
      - name: Run entry gate audit
        shell: bash
        run: |
          set -o pipefail
          python -m futureview.strategy1_entry_gate_audit 2>&1 | tee strategy1-entry-gate-audit.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Strategy 1 — Entry-centric C/Q gate audit'
            echo
            echo '```text'
            grep -E '^S1 ENTRYGATE' strategy1-entry-gate-audit.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
