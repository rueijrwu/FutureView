name: Strategy 1 Profitability AE Research

on:
  push:
    branches: [strategy-profitability-restart]
    paths:
      - 'src/futureview/strategy1_profitability_ae_research.py'
      - '.github/workflows/strategy1-profitability-ae-research.yml'
      - 'docs/AE_LOW_DIMENSION_TEST.md'
      - 'Theory.md'
      - 'Implementation.md'
  workflow_dispatch:

jobs:
  smh-ae-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps
      - name: Run SMH historical low-dimensionality test
        env:
          CUDA_VISIBLE_DEVICES: ''
          FUTUREVIEW_TICKER: SMH
          FUTUREVIEW_DATA_PERIOD: 5y
          FUTUREVIEW_AE_WINDOW: '60'
          FUTUREVIEW_AE_STRIDE: '5'
          FUTUREVIEW_AE_EPOCHS: '80'
          FUTUREVIEW_AE_SEED: '7'
        run: |
          set -o pipefail
          python -m futureview.strategy1_profitability_ae_research 2>&1 | tee strategy1-profitability-ae-research.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — unsupervised profitability AE research'
            echo
            echo '```text'
            grep -E '^AE (DATA|PRINCIPLE|DIMSET|CHOSEN|POSTHOC|COMPLETE)' strategy1-profitability-ae-research.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy1-profitability-ae-research-${{ github.run_number }}
          path: strategy1-profitability-ae-research.log
          retention-days: 30
