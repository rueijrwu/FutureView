name: Replay Cloudflare Check

on:
  push:
    branches: [master]
    paths:
      - 'cloudflare/**'
      - 'src/mes_replay/cloud_export.py'
      - 'src/mes_replay/cli.py'
      - '.github/workflows/replay-cloudflare-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Browser and Worker syntax
        run: |
          node --check src/mes_replay/static/app.js
          node --check cloudflare/public/app.js
          node --check cloudflare/worker/main.js
          node --check cloudflare/worker/replay-session.js
      - name: Wrangler dry run
        working-directory: cloudflare
        run: npx --yes wrangler@4.125.0 deploy --dry-run --outdir .dry-run
