name: Replay Cloudflare Check

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'site/**'
      - 'cloudflare/**'
      - 'pyproject.toml'
      - '.github/workflows/replay-cloudflare-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Browser and Worker syntax
        run: |
          node --check site/app.js
          node --check site/chart-tools.js
          node --check site/chart-tools-fixes.js
          node --check site/chart-ui-repair.js
          node --check site/chart-ui-repair.test.mjs
          node --check site/replay-range.js
          node --check src/futureview_replay/static/app.js
          node --check cloudflare/public/app.js
          node --check cloudflare/worker/main.js
          node --check cloudflare/worker/main-frame.js
          node --check cloudflare/worker/replay-session-core.js
          node --check cloudflare/worker/replay-session.js
          node --check cloudflare/worker/replay-session-frame.js
          node --check cloudflare/worker/replay-session-display.js
          node --check cloudflare/worker/replay-session-display-fast.js
          node --check cloudflare/worker/replay-release.test.mjs
          node --check cloudflare/worker/replay-display.test.mjs
          node --check cloudflare/worker/replay-display-fast.test.mjs
          node --check cloudflare/worker/replay-window-fast.test.mjs
          node --check cloudflare/worker/replay-active-fast.test.mjs
          node --check cloudflare/worker/replay-history-fast.test.mjs
          node --check cloudflare/worker/replay-prefetch-fast.test.mjs
      - name: Replay semantics
        run: node --test cloudflare/worker/replay-release.test.mjs cloudflare/worker/replay-display.test.mjs cloudflare/worker/replay-display-fast.test.mjs cloudflare/worker/replay-window-fast.test.mjs cloudflare/worker/replay-active-fast.test.mjs cloudflare/worker/replay-history-fast.test.mjs cloudflare/worker/replay-prefetch-fast.test.mjs
      - name: Chart hot-path semantics
        run: node --test site/chart-ui-repair.test.mjs
      - name: Wrangler dry run
        working-directory: cloudflare
        run: npx --yes wrangler@4.125.0 deploy --dry-run --outdir .dry-run
