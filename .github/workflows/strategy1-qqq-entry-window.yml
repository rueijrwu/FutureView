name: Strategy 1 QQQ +3 Entry Window

on:
  workflow_dispatch:
  push:
    branches:
      - cnn-trend-reset
    paths:
      - 'src/futureview/strategy1_success_entry_window.py'
      - 'src/futureview/strategy1_success_threshold.py'
      - 'src/futureview/strategy1_success_training.py'
      - 'src/futureview/strategy1.py'
      - 'src/futureview/strategy1_reference_distribution.py'
      - 'src/futureview/strategy1_reference_distribution_fast.py'
      - 'src/futureview/features.py'
      - 'src/futureview/models.py'
      - 'src/futureview/data.py'
      - 'pyproject.toml'
      - '.github/workflows/strategy1-qqq-entry-window.yml'

permissions:
  contents: read

jobs:
  qqq-entry-window:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FUTUREVIEW_TICKER: QQQ

    steps:
      - name: Checkout cnn-trend-reset
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps

      - name: Compare Q80 Day-0 vs +3-session delayed entry
        shell: bash
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: |
          set -o pipefail
          futureview-strategy1-success-entry-window 2>&1 | tee strategy1-qqq-entry-window.log

      - name: Write results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Strategy 1 QQQ +3 Entry Window'
            echo
            echo 'Branch: `cnn-trend-reset`'
            echo 'Ticker: `QQQ`'
            echo 'Gate: `Q80 historical calibration threshold`'
            echo 'Delayed entry: `first legal session in t+1..t+3`'
            echo
            if [[ -f strategy1-qqq-entry-window.log ]]; then
              echo '```text'
              grep -E '^S1 ENTRY_WINDOW (DATA|RULE|FOLD_METRIC|SUMMARY|PASS)' strategy1-qqq-entry-window.log || true
              echo '```'
            else
              echo 'No entry-window log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload entry-window log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-qqq-entry-window-${{ github.run_number }}
          path: strategy1-qqq-entry-window.log
          if-no-files-found: warn
          retention-days: 30
