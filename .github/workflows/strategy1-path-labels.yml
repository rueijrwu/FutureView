name: Strategy 1 Path-Level Labels

on:
  push:
    branches: [cnn-trend-reset]
    paths:
      - 'src/futureview/strategy1_classifier_path_labels.py'
      - '.github/workflows/strategy1-path-labels.yml'
  workflow_dispatch:

jobs:
  path-labels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps
      - name: Build path-level labels
        env:
          FUTUREVIEW_WORKERS: '1'
        run: |
          set -o pipefail
          python -m futureview.strategy1_classifier_path_labels 2>&1 | tee strategy1-path-labels.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — Path-Level Labels'
            echo
            echo '```text'
            grep -E '^S1 PATH_LABEL' strategy1-path-labels.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy1-path-labels-${{ github.run_number }}
          path: |
            strategy1-path-labels.csv
            strategy1-path-labels.log
          retention-days: 30
