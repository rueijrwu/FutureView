name: Replay Data Publish

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product to build and publish (MES, ES, or ALL)'
        required: true
        default: 'ALL'
  push:
    branches: [master]
    paths:
      - 'data/raw_sources.json'
      - 'src/futureview_replay/fetch_raw.py'
      - 'src/futureview_replay/prepare.py'
      - 'src/futureview_replay/cloud_export.py'
      - 'src/futureview_replay/resolver.py'
      - 'cloudflare/publish-r2.sh'
      - 'pyproject.toml'
      - '.github/workflows/replay-data-publish.yml'

permissions:
  contents: read

concurrency:
  group: futureview-replay-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        product: ${{ (github.event.inputs.product == 'MES' && fromJSON('["MES"]')) || (github.event.inputs.product == 'ES' && fromJSON('["ES"]')) || fromJSON('["MES", "ES"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install replay package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Fetch raw archive from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: futureview-replay fetch-raw --product "${{ matrix.product }}" --output ".local-data/raw/${{ matrix.product }}"

      - name: Build cloud replay data
        run: |
          futureview-replay prepare --product "${{ matrix.product }}" --raw ".local-data/raw/${{ matrix.product }}" --runtime "runtime/${{ matrix.product }}"
          futureview-replay cloud-export --runtime "runtime/${{ matrix.product }}" --output "runtime/${{ matrix.product }}/cloud-export"
          test -f "runtime/${{ matrix.product }}/cloud-export/manifest.json"

      - name: Publish replay data to R2
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLISH_PARALLELISM: '12'
        run: bash publish-r2.sh "../runtime/${{ matrix.product }}/cloud-export"
