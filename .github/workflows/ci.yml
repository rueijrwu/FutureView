name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: view/package-lock.json

      - name: Check Worker JavaScript syntax
        run: npm run check:worker

      - name: Run JS regression tests
        run: npm test

      - name: Validate D1 migration SQL
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            sqlite3 /tmp/futureview.db < "$migration"
          done
          sqlite3 /tmp/futureview.db '.schema' > /tmp/schema.txt
          grep -q 'CREATE TABLE ranking_runs' /tmp/schema.txt
          grep -q 'strategy_version' /tmp/schema.txt
          grep -q 'CREATE TABLE backtest_runs' /tmp/schema.txt

      - name: Install frontend dependencies
        run: npm ci --prefix view

      - name: Lint frontend
        run: npm run lint --prefix view

      - name: Build frontend
        run: npm run build --prefix view
