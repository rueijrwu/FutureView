name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: view/package-lock.json

      - name: Check Worker JavaScript syntax
        run: |
          node --check worker/index.js
          node --check worker/main.js
          node --check worker/incremental-workflow.js
          node --check worker/ranking-core.js
          node --check worker/ranking-replay.js
          node --check worker/ranking-replay-workflow.js

      - name: Install frontend dependencies
        run: npm ci --prefix view

      - name: Lint frontend
        run: npm run lint --prefix view

      - name: Build frontend
        run: npm run build --prefix view
