name: Strategy 1 SMH Ridge L mu U

on:
  push:
    branches: [cnn-trend-reset]
    paths:
      - 'src/futureview/strategy1_smh_ridge_lmu.py'
      - 'src/futureview/strategy1_success_training.py'
      - 'src/futureview/strategy1_reference_distribution.py'
      - 'src/futureview/strategy1_reference_distribution_fast.py'
      - 'src/futureview/strategy1.py'
      - 'src/futureview/features.py'
      - 'src/futureview/data.py'
      - '.github/workflows/strategy1-smh-ridge-lmu.yml'
  workflow_dispatch:

jobs:
  smh-ridge-lmu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps

      - name: Run SMH daily Ridge L mu U audit
        env:
          CUDA_VISIBLE_DEVICES: ''
          FUTUREVIEW_WORKERS: '1'
        run: |
          set -o pipefail
          python -m futureview.strategy1_smh_ridge_lmu 2>&1 | tee strategy1-smh-ridge-lmu.log

      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — SMH Daily Ridge L / mu / U'
            echo
            echo '```text'
            grep -E '^S1 SMH_RIDGE (DATA|MODEL|EVAL|FOLD_TARGET|SUMMARY|COMPLETE)' strategy1-smh-ridge-lmu.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy1-smh-ridge-lmu-${{ github.run_number }}
          path: strategy1-smh-ridge-lmu.log
          retention-days: 30
