name: Replay Pages Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/replay-pages-deploy.yml'

permissions:
  contents: read

concurrency:
  group: futureview-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Ensure FutureView Pages production project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/futureview"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          STATUS=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' "$API" -H "$AUTH")
          if [ "$STATUS" = "404" ]; then
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "$AUTH" \
              -H "Content-Type: application/json" \
              --data '{"name":"futureview","production_branch":"master"}' >/tmp/pages-project.json
          elif [ "$STATUS" = "200" ]; then
            curl -fsS -X PATCH "$API" \
              -H "$AUTH" \
              -H "Content-Type: application/json" \
              --data '{"production_branch":"master"}' >/tmp/pages-project.json
          else
            cat /tmp/pages-project.json
            exit 1
          fi
          test "$(jq -r '.result.production_branch' /tmp/pages-project.json)" = "master"

      - name: Deploy replay frontend to production Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=futureview --branch=master

      - name: Verify canonical production alias
        run: |
          set -euo pipefail
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors \
            https://futureview.pages.dev/ -o /tmp/futureview-index.html
          grep -q '<title>FutureView</title>' /tmp/futureview-index.html
          echo "futureview.pages.dev is healthy"
