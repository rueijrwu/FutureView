name: Replay Pages Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/replay-pages-deploy.yml'

permissions:
  contents: read

concurrency:
  group: futureview-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Ensure FutureView Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/futureview"
          STATUS=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [ "$STATUS" = "404" ]; then
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"futureview","production_branch":"master"}' >/tmp/pages-create.json
          elif [ "$STATUS" != "200" ]; then
            cat /tmp/pages-project.json
            exit 1
          fi

      - name: Deploy replay frontend to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=futureview --branch=master
