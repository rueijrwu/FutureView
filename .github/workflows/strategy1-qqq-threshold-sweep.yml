name: Strategy 1 QQQ Threshold Sweep

on:
  push:
    branches: [cnn-trend-reset]
    paths:
      - 'src/futureview/strategy1_success_threshold_sweep.py'
      - 'src/futureview/strategy1_success_entry_window.py'
      - 'src/futureview/strategy1_success_threshold.py'
      - 'src/futureview/strategy1_success_training.py'
      - 'pyproject.toml'
      - '.github/workflows/strategy1-qqq-threshold-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qqq-threshold-sweep:
    runs-on: ubuntu-24.04
    env:
      FUTUREVIEW_TICKER: QQQ
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - name: Checkout cnn-trend-reset
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps

      - name: Sweep Q50 Q60 Q70 Q80 with +3-session delayed entry
        run: |
          set -o pipefail
          futureview-strategy1-success-threshold-sweep 2>&1 | tee strategy1-qqq-threshold-sweep.log

      - name: Write results to job summary
        if: always()
        run: |
          {
            echo '## Strategy 1 QQQ Threshold Sweep'
            echo
            echo 'Branch: `cnn-trend-reset`'
            echo 'Ticker: `QQQ`'
            echo 'Quantiles: `Q50 / Q60 / Q70 / Q80`'
            echo 'Entry execution: `first legal session in t+1..t+3`'
            echo
            if [[ -f strategy1-qqq-threshold-sweep.log ]]; then
              echo '```text'
              grep -E '^S1 THRESHOLD_SWEEP (DATA|RULE|FOLD_METRIC|SUMMARY|PASS)' strategy1-qqq-threshold-sweep.log || true
              echo '```'
            else
              echo 'No threshold-sweep log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload threshold sweep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-qqq-threshold-sweep-${{ github.run_number }}
          path: strategy1-qqq-threshold-sweep.log
          if-no-files-found: warn
          retention-days: 30
