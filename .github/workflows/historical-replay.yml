name: Historical Replay Validation

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Historical trading date to replay"
        required: true
        default: "2026-08-20"
        type: string

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FutureView
        run: python -m pip install .

      - name: Prepare isolated replay state, Massive bars, and batch reference
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPLAY_DATE: ${{ inputs.date }}
        run: python -m futureview.features.replay prepare --date "$REPLAY_DATE"

      - name: Prepare isolated ranking replay inputs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPLAY_DATE: ${{ inputs.date }}
        run: python -m futureview.screener.ranking_replay --date "$REPLAY_DATE"

      - name: Deploy latest Worker and Workflows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify feature Workflow deployed version exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WORKFLOW="futureview-incremental-features"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW}/versions"
          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$API")
            COUNT=$(printf '%s' "$BODY" | python -c 'import json,sys; p=json.load(sys.stdin); r=p.get("result") or []; print(len(r) if isinstance(r,list) else 0)')
            echo "Feature Workflow deployed version count: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Trigger Cloudflare feature replay workflow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPLAY_DATE: ${{ inputs.date }}
        run: |
          ROOT="validation/replay/date=${REPLAY_DATE}"
          PARAMS=$(printf '{"mode":"replay","target_date":"%s","state_metadata_key":"%s/source-state/metadata.json","bars_key":"%s/input/bars.json","root":"%s"}' \
            "$REPLAY_DATE" "$ROOT" "$ROOT" "$ROOT")
          npx --yes wrangler@latest workflows trigger futureview-incremental-features "$PARAMS"

      - name: Compare Cloudflare incremental output with Python batch reference
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPLAY_DATE: ${{ inputs.date }}
        run: python -m futureview.features.replay compare --date "$REPLAY_DATE" --timeout 300

      - name: Trigger isolated Cloudflare ranking replay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPLAY_DATE: ${{ inputs.date }}
        run: |
          ROOT="validation/replay/date=${REPLAY_DATE}"
          PARAMS=$(printf '{"target_date":"%s","root":"%s","ranking_state_metadata_key":"%s/source-ranking-state/metadata.json","universe_key":"%s/input/common-stocks.json"}' \
            "$REPLAY_DATE" "$ROOT" "$ROOT" "$ROOT")
          npx --yes wrangler@latest workflows trigger futureview-ranking-replay "$PARAMS"

      - name: Compare Cloudflare ranking output with Python batch reference
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPLAY_DATE: ${{ inputs.date }}
        run: >-
          python -m futureview.screener.ranking_replay
          --date "$REPLAY_DATE" --compare --timeout 300
