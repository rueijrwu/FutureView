name: Strategy 1 QQQ Expanded Baseline Compare

on:
  push:
    branches:
      - cnn-trend-reset
    paths:
      - "src/futureview/strategy1_success_expanded_baseline_compare.py"
      - "src/futureview/strategy1_success_live_campaign_expanded_oos.py"
      - "src/futureview/strategy1_success_live_campaign.py"
      - "src/futureview/strategy1_success_entry_window.py"
      - "src/futureview/strategy1_success_training.py"
      - "src/futureview/strategy1_success_threshold.py"
      - "src/futureview/strategy1_success_adaptive_gate.py"
      - "src/futureview/strategy1.py"
      - "src/futureview/data.py"
      - "pyproject.toml"
      - ".github/workflows/strategy1-qqq-expanded-baseline-compare.yml"
  workflow_dispatch:

jobs:
  qqq-expanded-baseline-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FUTUREVIEW_TICKER: QQQ
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout cnn-trend-reset
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps

      - name: Compare locked Q55 with ungated Strategy 1 baseline
        run: |
          set -o pipefail
          futureview-strategy1-success-expanded-baseline-compare 2>&1 | tee strategy1-qqq-expanded-baseline-compare.log

      - name: Write results to job summary
        if: always()
        run: |
          {
            echo '## Strategy 1 QQQ Expanded Baseline Compare'
            echo
            echo 'Branch: `cnn-trend-reset`'
            echo 'Ticker: `QQQ`'
            echo 'Q55: `max(rolling Q70, calibration Q55)`'
            echo 'Baseline: `no model gate; every formal Entry candidate is a setup signal`'
            echo 'Shared execution: `first legal session in t+1..t+3, flat-only, non-overlap`'
            echo
            if [[ -f strategy1-qqq-expanded-baseline-compare.log ]]; then
              echo '```text'
              grep -E '^S1 EXPANDED_BASELINE_COMPARE (DATA|RULE|BASELINE_FOLD|BASELINE_SUMMARY|BASELINE_CAMPAIGN|Q55_SEED|SUMMARY|PASS)' strategy1-qqq-expanded-baseline-compare.log || true
              echo '```'
            else
              echo 'No expanded baseline comparison log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-qqq-expanded-baseline-compare-${{ github.run_number }}
          path: strategy1-qqq-expanded-baseline-compare.log
          if-no-files-found: warn
          retention-days: 30
