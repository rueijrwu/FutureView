name: Strategy 1 Layer3 Multi-Horizon Audit

on:
  push:
    branches: [layer2-price-distribution-v1]
    paths:
      - 'src/futureview/strategy1_layer3_multihorizon_audit.py'
      - '.github/workflows/strategy1-layer3-multihorizon-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      FUTUREVIEW_TICKER: TSLA
      FUTUREVIEW_DATA_PERIOD: 8y
      FUTUREVIEW_MODEL_HISTORY: 90
      FUTUREVIEW_EPOCHS: 300
      FUTUREVIEW_ROLL_DAYS: 10
      FUTUREVIEW_L2_MEMORY: 150
      FUTUREVIEW_L3_MIN_TRAIN: 60
      FUTUREVIEW_L3_EPOCHS: 300
      FUTUREVIEW_OUTPUT: strategy1-layer3-multihorizon-audit.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'yfinance>=0.2.54' 'numba>=0.61' 'scikit-learn>=1.5' 'torch>=2.4'
          python -m pip install -e . --no-deps
      - name: Run audit
        run: |
          set -o pipefail
          python -m futureview.strategy1_layer3_multihorizon_audit 2>&1 | tee strategy1-layer3-multihorizon-audit.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — Layer3 multi-horizon audit / single-horizon checks'
            echo
            echo '```text'
            grep -E '^S1 L3 (CONFIG|SUMMARY|BUCKET)' strategy1-layer3-multihorizon-audit.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy1-layer3-multihorizon-audit
          path: |
            strategy1-layer3-multihorizon-audit.csv
            strategy1-layer3-multihorizon-audit.log
          if-no-files-found: warn
