name: Strategy 1 Classifier Label Analysis

on:
  push:
    branches: [cnn-trend-reset]
    paths:
      - 'src/futureview/strategy1_classifier_label_analysis.py'
      - '.github/workflows/strategy1-classifier-label-analysis.yml'
      - 'src/futureview/strategy1.py'
      - 'src/futureview/strategy1_reference_distribution.py'
      - 'src/futureview/strategy1_reference_distribution_fast.py'
      - 'src/futureview/strategy1_cq_data.py'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps
      - name: Analyze coarse classifier labels
        env:
          FUTUREVIEW_WORKERS: '1'
        run: |
          set -o pipefail
          python -m futureview.strategy1_classifier_label_analysis 2>&1 | tee strategy1-classifier-label-analysis.log
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-classifier-label-analysis-${{ github.run_number }}
          path: |
            strategy1-classifier-label-analysis.log
            strategy1-classifier-labels.csv
          retention-days: 30
