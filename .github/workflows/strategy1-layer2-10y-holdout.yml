name: Strategy 1 Layer 2 10Y Holdout

on:
  workflow_dispatch:
  push:
    branches: [strategy-profitability-restart]
    paths:
      - 'src/futureview/strategy1_layer2_10y_holdout.py'
      - 'tests/test_strategy1_layer2_10y_holdout.py'
      - '.github/workflows/strategy1-layer2-10y-holdout.yml'

jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'yfinance>=0.2.54' 'numba>=0.61' 'scikit-learn>=1.5' pytest torch
          python -m pip install -e . --no-deps
      - name: Unit tests
        run: pytest -q tests/test_strategy1_layer2_10y_holdout.py
      - name: Run holdout audit
        env:
          FUTUREVIEW_TICKER: TSLA
          FUTUREVIEW_DATA_PERIOD: 10y
          FUTUREVIEW_W: '30'
          FUTUREVIEW_MODEL_HISTORY: '90'
          FUTUREVIEW_NEUTRAL_ALPHA: '0.2'
          FUTUREVIEW_EPOCHS: '500'
          FUTUREVIEW_SEED: '20260828'
          FUTUREVIEW_HOLDOUT_OUTPUT: strategy1-layer2-10y-holdout.csv
        run: |
          set -o pipefail
          python -m futureview.strategy1_layer2_10y_holdout 2>&1 | tee strategy1-layer2-10y-holdout.log
      - name: Upload holdout comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-layer2-10y-holdout
          path: strategy1-layer2-10y-holdout.csv
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — Layer2 10Y / last-1Y holdout'
            echo
            echo '```text'
            grep -E '^S1 L2HOLD' strategy1-layer2-10y-holdout.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
