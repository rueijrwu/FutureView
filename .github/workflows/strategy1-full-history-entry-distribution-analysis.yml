name: Strategy 1 Full History Entry Distribution Analysis

on:
  push:
    branches: [cnn-trend-reset]
    paths:
      - 'src/futureview/strategy1_full_history_entry_distribution_analysis.py'
      - '.github/workflows/strategy1-full-history-entry-distribution-analysis.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps
      - name: Run full-history entry distribution analysis
        env:
          FUTUREVIEW_WORKERS: '1'
        run: |
          set -o pipefail
          python -m futureview.strategy1_full_history_entry_distribution_analysis 2>&1 | tee strategy1-full-history-entry-distribution-analysis.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — Full History Entry Distribution Analysis'
            echo
            echo '```text'
            grep -E '^S1 FULL_ENTRY (ENTRY|COMPLETE)' strategy1-full-history-entry-distribution-analysis.log | tail -n 30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy1-full-history-entry-distribution-${{ github.run_number }}
          path: |
            strategy1-full-history-entry-distribution-analysis.log
            strategy1-full-history-entry-distribution-summary.csv
            strategy1-full-history-entry-distributions.json
          retention-days: 30
