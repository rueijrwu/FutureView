name: Strategy 1 C/Q Fold Diagnostics

on:
  push:
    branches: [cnn-trend-reset]
    paths:
      - 'src/futureview/strategy1_cq_fold_diagnostics.py'
      - '.github/workflows/strategy1-cq-fold-diagnostics.yml'
  workflow_dispatch:

jobs:
  cq-fold-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps
      - name: Run fold diagnostics
        env:
          CUDA_VISIBLE_DEVICES: ''
          FUTUREVIEW_WORKERS: '1'
        run: |
          set -o pipefail
          python -m futureview.strategy1_cq_fold_diagnostics 2>&1 | tee strategy1-cq-fold-diagnostics.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## Strategy 1 — C/Q Fold Diagnostics'
            echo
            echo '```text'
            grep -E '^S1 CQ_FOLD_DIAG (DATA|FOLD|TRAIN_MU|TRAIN_C|TRAIN_Q|TEST_MU|TEST_C|TEST_Q|COMPLETE)' strategy1-cq-fold-diagnostics.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy1-cq-fold-diagnostics-${{ github.run_number }}
          path: strategy1-cq-fold-diagnostics.log
          retention-days: 30
