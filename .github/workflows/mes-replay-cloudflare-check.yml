name: MES Replay Cloudflare Check

on:
  push:
    branches: [intraday-futures-reset]
    paths:
      - 'mes-replay/cloudflare/**'
      - 'mes-replay/src/mes_replay/static/app.js'
      - 'mes-replay/src/mes_replay/cloud_export.py'
      - 'mes-replay/src/mes_replay/cli.py'
      - '.github/workflows/mes-replay-cloudflare-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Browser and Worker syntax
        run: |
          node --check mes-replay/src/mes_replay/static/app.js
          node --check mes-replay/cloudflare/public/app.js
          node --check mes-replay/cloudflare/worker/main.js
          node --check mes-replay/cloudflare/worker/replay-session.js
      - name: Wrangler dry run
        working-directory: mes-replay/cloudflare
        run: npx --yes wrangler@4.125.0 deploy --dry-run --outdir .dry-run
