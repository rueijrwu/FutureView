name: Replay Python

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'data/databento/mes/raw/**'
      - '.github/workflows/replay-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull one real MES month
        run: |
          git lfs install
          git lfs pull --include='data/databento/mes/raw/glbx-mdp3-20190506-20190531.ohlcv-1m.dbn.zst'
          test $(stat -c%s data/databento/mes/raw/glbx-mdp3-20190506-20190531.ohlcv-1m.dbn.zst) -gt 1000
      - name: Install replay package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Unit tests
        run: pytest -q tests
      - name: Prepare real Databento month
        run: mes-replay prepare --raw data/databento/mes/raw --runtime runtime --limit 1
      - name: Export replay shards
        run: |
          mes-replay cloud-export --runtime runtime --output runtime/cloud-export
          test -f runtime/cloud-export/manifest.json
          find runtime/cloud-export -name '*.json.gz' -print -quit | grep .
      - name: Server smoke
        run: |
          mes-replay serve --manifest runtime/manifest.json --host 127.0.0.1 --port 8787 > replay-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8787/api/health > health.json; then break; fi
            sleep .2
          done
          cat health.json
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          kill $SERVER_PID
