name: Replay Python

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'data/raw_sources.json'
      - '.github/workflows/replay-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Lint (pyflakes via ruff)
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q tests
      - name: Fetch one real MES month from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: futureview-replay fetch-raw --product MES --output .local-data/raw/MES --limit 1
      - name: Prepare real Databento month
        run: futureview-replay prepare --product MES --raw .local-data/raw/MES --runtime runtime/MES --limit 1
      - name: Export replay shards
        run: |
          futureview-replay cloud-export --runtime runtime/MES --output runtime/MES/cloud-export
          test -f runtime/MES/cloud-export/manifest.json
          find runtime/MES/cloud-export -name '*.json.gz' -print -quit | grep .
      - name: Server smoke
        run: |
          futureview-replay serve --manifest runtime/MES/manifest.json --host 127.0.0.1 --port 8787 > replay-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8787/api/health > health.json; then break; fi
            sleep .2
          done
          cat health.json
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          kill $SERVER_PID
