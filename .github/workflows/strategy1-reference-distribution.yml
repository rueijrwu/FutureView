name: Strategy 1 Reference Distribution

on:
  workflow_dispatch:
  push:
    branches:
      - cnn-trend-reset
    paths:
      - 'src/futureview/strategy1.py'
      - 'src/futureview/strategy1_reference_distribution.py'
      - 'src/futureview/strategy1_reference_distribution_formal.py'
      - 'src/futureview/strategy1_reference_distribution_fast.py'
      - 'src/futureview/strategy1_fixed_entry_compare.py'
      - 'src/futureview/strategy1_entry_luqmu_audit.py'
      - 'src/futureview/data.py'
      - 'pyproject.toml'
      - '.github/workflows/strategy1-reference-distribution.yml'

permissions:
  contents: read

jobs:
  reference-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ticker: [SPY, QQQ, SMH]
    env:
      FUTUREVIEW_TICKER: ${{ matrix.ticker }}

    steps:
      - name: Checkout cnn-trend-reset
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4" "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps

      - name: Run formal Strategy 1 Reference Distribution
        shell: bash
        env:
          CUDA_VISIBLE_DEVICES: ''
          FUTUREVIEW_WORKERS: '1'
        run: |
          set -o pipefail
          futureview-strategy1-reference-distribution-fast 2>&1 | tee strategy1-reference-distribution.log

      - name: Audit entry-level L U Q mu
        shell: bash
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: |
          set -o pipefail
          python -m futureview.strategy1_entry_luqmu_audit 2>&1 | tee strategy1-entry-luqmu.log

      - name: Compare 60D fixed three-entry baseline
        shell: bash
        env:
          CUDA_VISIBLE_DEVICES: ''
          FUTUREVIEW_WORKERS: '1'
        run: |
          set -o pipefail
          futureview-strategy1-fixed-entry-compare 2>&1 | tee strategy1-fixed-entry-compare.log

      - name: Write key results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Strategy 1 Reference Distribution — ${FUTUREVIEW_TICKER}"
            echo
            echo 'Branch: `cnn-trend-reset`'
            echo "Ticker: \`${FUTUREVIEW_TICKER}\`"
            echo 'Trigger: push or manual dispatch'
            echo
            if [[ -f strategy1-reference-distribution.log ]]; then
              echo '### Formal rule'
              echo '```text'
              grep -E '^S1 REFERENCE_DISTRIBUTION (FAST|DATA|RULE)' strategy1-reference-distribution.log || true
              echo '```'
              echo
              echo '### 60D / 90D'
              echo '```text'
              grep -E '^S1 REFERENCE_DISTRIBUTION (WINDOW|RETURN|EFFICIENCY|ADDON_GROUP) w=(60|90)' strategy1-reference-distribution.log || true
              echo '```'
            else
              echo 'No Reference Distribution log was produced.'
            fi
            echo
            echo '### Entry-level L / U / Q / mu audit'
            if [[ -f strategy1-entry-luqmu.log ]]; then
              echo '```text'
              grep -E '^S1 ENTRY_LUQMU (DATA|SUMMARY|GROUP|RELATION|PASS)' strategy1-entry-luqmu.log || true
              echo '```'
            else
              echo 'No entry-level L/U/Q/mu audit log was produced.'
            fi
            echo
            echo '### 60D fixed three-entry baseline vs Strategy Upper Bound'
            if [[ -f strategy1-fixed-entry-compare.log ]]; then
              echo '```text'
              grep -E '^S1 FIXED_ENTRY_COMPARE (DATA|RULE|RESULT|CAPTURE)' strategy1-fixed-entry-compare.log || true
              echo '```'
            else
              echo 'No fixed-entry comparison log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-reference-distribution-${{ matrix.ticker }}-${{ github.run_number }}
          path: |
            strategy1-reference-distribution.log
            strategy1-entry-luqmu.log
            strategy1-fixed-entry-compare.log
          if-no-files-found: warn
          retention-days: 30
