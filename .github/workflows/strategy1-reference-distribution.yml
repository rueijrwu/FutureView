name: Strategy 1 Reference Distribution

on:
  workflow_dispatch:
  push:
    branches:
      - cnn-trend-reset
    paths:
      - 'src/futureview/strategy1.py'
      - 'src/futureview/strategy1_reference_distribution.py'
      - 'src/futureview/strategy1_reference_distribution_formal.py'
      - 'src/futureview/strategy1_reference_distribution_fast.py'
      - 'src/futureview/data.py'
      - 'pyproject.toml'
      - '.github/workflows/strategy1-reference-distribution.yml'

permissions:
  contents: read

jobs:
  reference-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout cnn-trend-reset
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "yfinance>=0.2.54" "numba>=0.61"
          python -m pip install -e . --no-deps

      - name: Run formal Strategy 1 Reference Distribution
        shell: bash
        env:
          CUDA_VISIBLE_DEVICES: ''
          FUTUREVIEW_WORKERS: '1'
        run: |
          set -o pipefail
          futureview-strategy1-reference-distribution-fast 2>&1 | tee strategy1-reference-distribution.log

      - name: Write key results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Strategy 1 Reference Distribution'
            echo
            echo 'Branch: `cnn-trend-reset`'
            echo 'Trigger: push or manual dispatch'
            echo
            if [[ -f strategy1-reference-distribution.log ]]; then
              echo '### Formal rule'
              echo '```text'
              grep -E '^S1 REFERENCE_DISTRIBUTION (FAST|DATA|RULE)' strategy1-reference-distribution.log || true
              echo '```'
              echo
              echo '### 60D / 90D'
              echo '```text'
              grep -E '^S1 REFERENCE_DISTRIBUTION (WINDOW|RETURN|EFFICIENCY|ADDON_GROUP) w=(60|90)' strategy1-reference-distribution.log || true
              echo '```'
            else
              echo 'No result log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full Reference Distribution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy1-reference-distribution-${{ github.run_number }}
          path: strategy1-reference-distribution.log
          if-no-files-found: warn
          retention-days: 30
