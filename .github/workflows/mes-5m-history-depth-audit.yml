name: MES 5m History Depth Audit

on:
  push:
    branches: [intraday-futures-reset]
    paths:
      - '.github/workflows/mes-5m-history-depth-audit.yml'
      - 'src/futureview/market_data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mes-history-depth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas>=2.2' 'yfinance>=0.2.54'
      - name: Probe MES 5m history depth
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee mes-5m-history-depth.log
          from datetime import datetime, timedelta, timezone
          import json
          import time
          import pandas as pd
          import yfinance as yf

          symbol = 'MES=F'
          interval = '5m'
          now = datetime.now(timezone.utc)
          # Narrow 4-day windows probe whether that historical region is still retained.
          lookbacks = [0, 7, 14, 30, 45, 55, 58, 59, 60, 61, 65, 75, 90, 120, 180, 365, 730]
          results = []

          for days in lookbacks:
              end_dt = (now - timedelta(days=days)).date() + timedelta(days=1)
              start_dt = end_dt - timedelta(days=4)
              start = start_dt.isoformat()
              end = end_dt.isoformat()
              row = {
                  'lookback_days': days,
                  'start': start,
                  'end': end,
                  'rows': 0,
                  'first': None,
                  'last': None,
                  'status': 'empty',
                  'error': None,
              }
              try:
                  frame = yf.download(
                      symbol,
                      start=start,
                      end=end,
                      interval=interval,
                      auto_adjust=False,
                      actions=False,
                      progress=False,
                      threads=False,
                      prepost=True,
                  )
                  if not frame.empty:
                      row['rows'] = int(len(frame))
                      idx = pd.to_datetime(frame.index, utc=True)
                      row['first'] = idx.min().isoformat()
                      row['last'] = idx.max().isoformat()
                      row['status'] = 'ok'
              except Exception as exc:
                  row['status'] = 'error'
                  row['error'] = f'{type(exc).__name__}: {exc}'[:500]
              results.append(row)
              print(
                  'MES_5M_DEPTH',
                  f'lookback_days={days}',
                  f'status={row["status"]}',
                  f'rows={row["rows"]}',
                  f'start={start}',
                  f'end={end}',
                  f'first={row["first"]}',
                  f'last={row["last"]}',
                  f'error={row["error"]}',
                  flush=True,
              )
              time.sleep(0.4)

          ok = [r for r in results if r['status'] == 'ok']
          max_ok = max((r['lookback_days'] for r in ok), default=None)
          failed_after = min(
              (r['lookback_days'] for r in results if r['status'] != 'ok' and (max_ok is None or r['lookback_days'] > max_ok)),
              default=None,
          )
          print('MES_5M_DEPTH_SUMMARY', f'max_successful_probe_days={max_ok}', f'next_failed_probe_days={failed_after}')
          with open('mes-5m-history-depth.json', 'w', encoding='utf-8') as f:
              json.dump({'symbol': symbol, 'interval': interval, 'probed_at': now.isoformat(), 'results': results}, f, indent=2)
          PY
      - name: Summary
        if: always()
        run: |
          {
            echo '## MES 5m Yahoo History Depth Audit'
            echo
            echo '```text'
            grep -E '^MES_5M_DEPTH(_SUMMARY)?' mes-5m-history-depth.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mes-5m-history-depth-${{ github.run_number }}
          path: |
            mes-5m-history-depth.log
            mes-5m-history-depth.json
          retention-days: 30
